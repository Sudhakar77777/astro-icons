<!doctype html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Astro Icons</title>

    <style>
        body {
            font-family: sans-serif;
            padding: 40px;
        }

        .grid {
            display: grid;
            grid-template-columns: repeat(4, 120px);
            gap: 32px;
        }

        .grid div {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 8px;
            color: #7c2d12;
        }
    </style>
</head>

<body>
